plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'dev.forcetower.hilt.android.dynamic'
    compileSdk = 36
    defaultConfig {
        minSdk = 23
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'localBuild'
            url = rootProject.layout.buildDirectory.dir('repo')
        }
    }
}

afterEvaluate {
    publishing.publications {
        runtime(MavenPublication) {
            from components.release
        }
    }
}

dependencies {
    api "com.google.dagger:hilt-android:$hiltVersion"
    api 'androidx.activity:activity:1.11.0'
    api 'androidx.fragment:fragment:1.8.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
